[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-transformer-suite"
version = "0.1.0"
description = "Interactive attention rollout and head inspection for vision transformers."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "gradio>=4.44,<5.0",
  "gradio-client>=1.3,<1.4",
  "huggingface-hub<1.0",
  "numpy>=1.24,<2.0",
  "opencv-python-headless>=4.8,<5.0",
  "pydantic>=2.0,<2.10",
  "pillow>=10.0",
  "timm>=0.9.12",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
